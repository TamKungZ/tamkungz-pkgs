# Gradle publisher for the Maven repository.
#
# Copy to .github/workflows/release.yml and adapt the publishing configuration so
# ./gradlew publish writes a standard Maven repository tree to build/maven-repo/.
# See ../publish-to-local-repo.gradle for an example publishing repository block.
# The project version should already match the version being released.

name: Publish Maven artifacts

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Publish to a temporary local Maven repository
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon clean publish
          test -d build/maven-repo
          find build/maven-repo -type f -print -quit | grep -q .
          mkdir -p dist
          (cd build/maven-repo && zip -qr "$GITHUB_WORKSPACE/dist/maven-repo.zip" .)

      - name: Create GitHub release and upload repository bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/maven-repo.zip \
            --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag

      - name: Ask the package repository to publish this release
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_DISPATCH_TOKEN }}
          SOURCE: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          PACKAGES_REPO: TamKungZ/tamkungz-pkgs
        run: |
          gh workflow run publish.yml --repo "$PACKAGES_REPO" --ref main \
            -f source="$SOURCE" -f tag="$TAG"
