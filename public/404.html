<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SEO / crawler control -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="description" content="404 - The requested package or artifact was not found on TamKungZ_ Packages.">
  <meta name="theme-color" content="#03983d">
  <meta name="color-scheme" content="light dark">

  <!-- Open Graph -->
  <meta property="og:title" content="404 - TamKungZ_ Packages">
  <meta property="og:description" content="The requested package or artifact was not found.">
  <meta property="og:type" content="website">

  <title>404 - TamKungZ_ Packages</title>

  <!-- Absolute path: this page is served from any missing URL, so relative paths would break -->
  <link rel="stylesheet" href="/resources/css/global.css">

  <style>
    /* 404-only layout; colors all come from the shared tokens in global.css */
    body { display: flex; flex-direction: column; }
    main { flex: 1; display: flex; align-items: center; justify-content: center; width: 100%; }
    .error-page { max-width: 480px; margin-inline: auto; text-align: center; }
    .error-icon {
      width: 180px; height: 180px; margin: 0 auto 8px;
      background-color: var(--accent);
      -webkit-mask: url('/resources/svg/error-404.svg') center / contain no-repeat;
      mask: url('/resources/svg/error-404.svg') center / contain no-repeat;
    }
    .error-code {
      margin: 0 0 8px; font-size: 5rem; font-weight: 800; line-height: 1;
      letter-spacing: -0.04em; color: var(--accent-text);
    }
    .error-page .lead { margin: 0 auto 20px; }
    .error-path {
      display: inline-block; max-width: 100%; margin-bottom: 24px; padding: 8px 14px;
      background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
      font-family: var(--mono); font-size: 13px; color: var(--muted); word-break: break-all;
    }
    .error-path[hidden] { display: none; }
    .btn-primary {
      display: inline-block; padding: 10px 24px;
      background: var(--accent); color: #fff; font-weight: 600;
      border-radius: var(--radius-sm);
    }
    .btn-primary:hover { background: var(--accent-hover); color: #fff; text-decoration: none; }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <div class="wrap topbar-in">
      <a class="brand" href="/"><span>TamKungZ_ Packages</span></a>
      <nav class="nav" aria-label="Main">
        <a href="/">Packages</a>
        <a href="/terms/">Terms</a>
        <a href="/privacy/">Privacy</a>
        <a href="/license/">License</a>
      </nav>
      <a class="nav-ext" href="https://github.com/TamKungZ" rel="noopener">GitHub</a>
    </div>
  </header>

  <main id="main" class="wrap">
    <div class="error-page">
      <div class="error-icon" aria-hidden="true"></div>
      <h1 class="error-code">404</h1>
      <p class="lead">The requested package or artifact was not found.</p>

      <div id="error-path" class="error-path" hidden></div>

      <div>
        <a href="/" class="btn-primary">Return to Packages</a>
      </div>
    </div>
  </main>

  <footer>
    <div class="wrap footer-in">
      <span>&copy; 2026 TamKungZ_</span>
      <div class="footer-links">
        <a href="/terms/">Terms</a>
        <a href="/privacy/">Privacy</a>
        <a href="/license/">License</a>
        <a href="mailto:dev@tamkungz.me">dev@tamkungz.me</a>
      </div>
    </div>
  </footer>

  <script>
    // Show the path that was not found (textContent only, so it is safe).
    (function () {
      var el = document.getElementById('error-path');
      if (el && location.pathname && location.pathname !== '/') {
        el.textContent = location.pathname;
        el.hidden = false;
      }
    })();
  </script>
</body>
</html>
