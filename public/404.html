<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- SEO / crawler control -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="googlebot" content="noindex, nofollow">
  <meta name="description" content="404 - The requested package or artifact was not found on TamKungZ_ Packages.">
  <meta name="theme-color" content="#03983d">
  <meta name="color-scheme" content="light dark">

  <!-- Open Graph -->
  <meta property="og:title" content="404 - TamKungZ_ Packages">
  <meta property="og:description" content="The requested package or artifact was not found.">
  <meta property="og:type" content="website">

  <title>404 - TamKungZ_ Packages</title>

  <style>
    /* Same design tokens as the main site (global.css), inlined so this page is self-contained */
    :root {
      color-scheme: light dark;
      --bg: #f6f9f7;
      --surface: #ffffff;
      --surface-2: #f1f6f3;
      --text: #14201a;
      --muted: #5a6a60;
      --line: #dce6e0;
      --accent: #03983d;
      --accent-hover: #026b2c;
      --accent-text: #027a31;
      --accent-soft: #e6f6ec;
      --radius-sm: 6px;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Thai", "Noto Sans", sans-serif;
      --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d1310;
        --surface: #141c18;
        --surface-2: #1a2420;
        --text: #e7f0ea;
        --muted: #94a69b;
        --line: #27352e;
        --accent-text: #3dd77f;
        --accent-soft: #12291c;
        --accent-hover: #027a31;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      border-top: 3px solid var(--accent);
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.55;
    }

    a { color: var(--accent-text); text-decoration: none; }
    a:hover { text-decoration: underline; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

    .wrap { width: min(1080px, calc(100% - 32px)); margin-inline: auto; }



    /* ---------- 404 content ---------- */
    main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 28px 0 40px; }
    .error-page { max-width: 480px; margin-inline: auto; text-align: center; }
    .error-icon {
      display: block; width: min(280px, 75%); height: auto;
      margin: 0 auto 12px; color: var(--accent-text);
    }
    h1 {
      margin: 0 0 8px; font-size: 5rem; font-weight: 800; line-height: 1;
      letter-spacing: -0.04em; color: var(--accent-text);
    }
    .lead { margin: 0 auto 20px; color: var(--muted); font-size: 1.05rem; }
    .error-path {
      display: inline-block; max-width: 100%; margin-bottom: 24px; padding: 8px 14px;
      background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--radius-sm);
      font-family: var(--mono); font-size: 13px; color: var(--muted); word-break: break-all;
    }
    .error-path[hidden] { display: none; }
    .btn-primary {
      display: inline-block; padding: 10px 24px;
      background: var(--accent); color: #fff; font-weight: 600;
      border-radius: var(--radius-sm);
    }
    .btn-primary:hover { background: var(--accent-hover); color: #fff; text-decoration: none; }


    @media (max-width: 640px) {
      .wrap { width: calc(100% - 24px); }
        h1 { font-size: 4rem; }
    }
  </style>
</head>
<body>

  <main class="wrap">
    <div class="error-page">
      <svg class="error-icon" viewBox="0 0 400 330" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" stroke-linejoin="round" stroke-linecap="round">
  <!-- ground shadow -->
  <ellipse cx="200" cy="312" rx="104" ry="9" fill="currentColor" opacity=".12"/>
  <!-- empty box: left / right faces, open top -->
  <path d="M110 190 200 230V310L110 270Z" fill="currentColor" opacity=".9"/>
  <path d="M200 230 290 190V270L200 310Z" fill="currentColor" opacity=".6"/>
  <path d="M200 150 290 190 200 230 110 190Z" fill="currentColor" fill-opacity=".14" stroke="currentColor" stroke-width="4"/>
  <!-- box label -->
  <path d="M130 226 164 242" stroke="#fff" stroke-opacity=".7" stroke-width="5"/>
  <!-- missing package (dashed ghost cube) with question mark -->
  <path d="M200 20 240 42V88L200 110 160 88V42Z" stroke="currentColor" stroke-width="4" stroke-dasharray="3 10"/>
  <path d="M187 60C187 46 213 46 213 60 213 69 200 71 200 80" stroke="currentColor" stroke-width="5"/>
  <circle cx="200" cy="93" r="3.5" fill="currentColor" stroke="none"/>
  <!-- small accents -->
  <rect x="70" y="92" width="14" height="14" rx="3" fill="currentColor" opacity=".35" transform="rotate(18 77 99)"/>
  <rect x="318" y="118" width="10" height="10" rx="2" fill="currentColor" opacity=".25" transform="rotate(-14 323 123)"/>
  <circle cx="320" cy="60" r="5" fill="currentColor" opacity=".3"/>
  <circle cx="86" cy="222" r="4" fill="currentColor" opacity=".25"/>
</svg>
      <h1>404</h1>
      <p class="lead">The requested package or artifact was not found.</p>

      <div id="error-path" class="error-path" hidden></div>

      <div>
        <a href="/" class="btn-primary">Return to Packages</a>
      </div>
    </div>
  </main>

  <script>
    // Show the path that was not found (textContent only, so it is safe).
    (function () {
      var el = document.getElementById('error-path');
      if (el && location.pathname && location.pathname !== '/') {
        el.textContent = location.pathname;
        el.hidden = false;
      }
    })();
  </script>
</body>
</html>
